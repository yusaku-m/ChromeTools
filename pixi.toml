[workspace]
authors = ["Yusaku_MAEDA13 <jagaimo13@gmail.com>"]
channels = ["conda-forge"]
name = "ChromeTools"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
python = ">=3.10"
selenium = ">=4.10"
webdriver-manager = "*"
pandas = "*"
psutil = "*"
pyautogui = "*"
tqdm = "*"
openpyxl = "*"
requests = "*"
icalendar = "*"
python-dateutil = "*"
keyring = "*"
pywin32 = ">=312,<313"

[tasks]
# pixi run shr [MMDD]  (例: pixi run shr 1027。省略時は今日)
shr = "python shr_absence_sakura.py"
# pixi run absence [MMDD]  (省略時は行事予定から求めた前回の授業日)
absence = "python class_absence_sakura.py"
